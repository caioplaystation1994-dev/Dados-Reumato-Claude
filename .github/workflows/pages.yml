name: Deploy GitHub Pages

# Tudo vive nesta branch:
#
#   raiz/            as ferramentas clínicas (fonte, sem senha)
#   docs/            o site publicado — raiz do domínio = site pessoal
#   docs/app/        as ferramentas servidas, geradas da raiz por
#                    scripts/publicar-apps.js com noindex + tela de senha
#
# O que vai ao ar é sempre gerado aqui, na hora. Antes o site morava em outra
# branch e qualquer push nesta republicava a raiz do repositório, o que já
# derrubou o site pessoal uma vez, colocando o portal de documentos — sem
# senha — no endereço principal. Daí a verificação antes do deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar docs/app/ a partir da raiz
        run: node scripts/publicar-apps.js

      - name: Conferir o site antes de publicar
        run: |
          for f in docs/app/documentos_ambulatorio.html \
                   docs/app/laudo_imunobiologicos.html \
                   docs/app/laudo_convenio_imunobio.html \
                   docs/app/investimentos.html; do
            grep -q 'src="gate.js"' "$f" || { echo "::error::$f sem a tela de senha"; exit 1; }
          done
          if grep -q 'Sistema de Documentos' docs/index.html; then
            echo "::error::a raiz do site não é o site pessoal"; exit 1
          fi
          test -f docs/CNAME || { echo "::error::docs/CNAME sumiu — o domínio deixaria de apontar para cá"; exit 1; }
          echo "ok: raiz = site pessoal, /app/ protegido por senha, domínio preservado"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
